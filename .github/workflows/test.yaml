---
name: securefix
# on: push
on: pull_request
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required to assume the AWS IAM role that signs the GitHub App JWT with KMS
      id-token: write
    steps:
      - uses: suzuki-shunsuke/create-github-app-token-aws-kms@latest
        id: token
        with:
          app-id: ${{vars.AUTOFIX_TRIGGER_APP_ID}}
          role-to-assume: ${{vars.AUTOFIX_TRIGGER_ROLE_TO_ASSUME}}
          kms-key-id: ${{vars.AUTOFIX_TRIGGER_KMS_KEY_ID}}
          permission-issues: read

      - run: gh issue list
        env:
          GH_TOKEN: ${{steps.token.outputs.token}}
